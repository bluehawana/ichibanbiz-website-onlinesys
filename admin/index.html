<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ichiban Kök — beställningar</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="/admin/manifest.webmanifest">
<meta name="theme-color" content="#010801">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/assets/img/site/favicon.png">
<link rel="apple-touch-icon" href="/assets/img/site/apple-touch-icon.png">
<style>
  :root {
    --bg:#010801; --raise:#10140f; --card:#1c211b; --ink:#f3ede3; --dim:#e5c4ac; --faint:#948a7b;
    --aka:#a91a3e; --gold:#e2b13c; --ok:#5da96c; --line:rgba(229,196,172,.16);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--ink); font-family:"Instrument Sans",system-ui,sans-serif; font-size:16px; line-height:1.5; padding-bottom:4rem; }
  header { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:0.8rem; padding:0.9rem 1.1rem; background:var(--raise); border-bottom:1px solid var(--line); }
  header .seal { width:36px;height:36px;border-radius:6px;background:var(--aka);color:#fff;display:grid;place-items:center;font-weight:700;transform:rotate(-4deg); }
  header h1 { font-size:1.05rem; margin-right:auto; }
  header .dot { width:10px;height:10px;border-radius:99px;background:#777; }
  header .dot.on { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .tabs { display:flex; gap:0.4rem; padding:0.8rem 1.1rem 0; }
  .tabs button { flex:1; padding:0.65rem; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--dim); font:inherit; font-weight:600; }
  .tabs button.active { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .tabs button .badge { background:var(--aka); color:#fff; border-radius:99px; padding:0 0.5em; margin-left:0.35em; font-size:0.85em; }
  main { padding:1.1rem; display:grid; gap:0.9rem; max-width:760px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:1.1rem; }
  .card.new { border-color:var(--aka); box-shadow:0 0 0 1px var(--aka), 0 8px 30px -12px rgba(207,63,43,.5); animation:pulse 1.2s ease-in-out infinite alternate; }
  @keyframes pulse { from { box-shadow:0 0 0 1px var(--aka); } to { box-shadow:0 0 0 4px var(--aka); } }
  .row { display:flex; justify-content:space-between; align-items:baseline; gap:0.8rem; flex-wrap:wrap; }
  .num { font-size:1.5rem; font-weight:700; }
  .pickup { font-size:1.15rem; font-weight:700; color:var(--gold); }
  .meta { color:var(--dim); font-size:0.92rem; margin-top:0.15rem; }
  .meta a { color:var(--ink); }
  .lines { margin:0.8rem 0; border-top:1px dashed var(--line); padding-top:0.8rem; display:grid; gap:0.3rem; }
  .lines div { display:flex; justify-content:space-between; gap:1rem; }
  .lines .q { color:var(--aka); font-weight:700; min-width:2.6em; }
  .lines .line-hot { background:rgba(230,126,34,.18); border-radius:8px; margin:0.1rem -0.5rem; padding:0.1rem 0.5rem; }
  /* history + search */
  .search-bar { display:flex; gap:0.6rem; padding:0.9rem 1.1rem 0; max-width:760px; margin:0 auto; flex-wrap:wrap; }
  .search-bar input, .search-bar select { flex:1; min-width:140px; padding:0.7rem 0.9rem; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:inherit; }
  .hrow { display:flex; align-items:center; gap:0.9rem; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:0.8rem 1rem; cursor:pointer; }
  .hrow:hover { border-color:var(--aka); }
  .hrow .hnum { font-weight:800; font-size:1.15rem; min-width:3.2em; }
  .hrow .hmeta { flex:1; min-width:0; } .hrow .hmeta .hname { font-weight:600; } .hrow .hmeta .hsub { color:var(--dim); font-size:0.85rem; }
  .hrow .htot { font-weight:700; white-space:nowrap; }
  .hrow .st { flex:none; }
  .hlist { padding:1.1rem; display:grid; gap:0.6rem; max-width:760px; margin:0 auto; }
  .muted-center { text-align:center; color:var(--faint); padding:2.5rem 1rem; }
  /* detail modal */
  .modal { position:fixed; inset:0; z-index:60; background:rgba(6,5,4,.72); display:grid; place-items:start center; padding:3vh 1rem; overflow-y:auto; }
  .modal[hidden] { display:none; }
  .modal-card { position:relative; width:min(760px,100%); background:var(--bg); border:1px solid var(--line); border-radius:16px; padding:1.6rem 1.4rem; box-shadow:0 30px 80px -30px rgba(0,0,0,.8); }
  .modal-close { position:absolute; top:0.7rem; right:0.7rem; width:40px; height:40px; border-radius:10px; border:1px solid var(--line); background:none; color:var(--ink); font-size:1.5rem; line-height:1; }
  .d-head { display:flex; align-items:center; gap:0.7rem; flex-wrap:wrap; margin-bottom:0.2rem; }
  .d-head .num { font-size:1.8rem; font-weight:800; }
  .d-placed { color:var(--dim); font-size:0.9rem; margin-bottom:1.2rem; }
  .d-grid { display:grid; grid-template-columns:1.4fr 1fr; gap:1.4rem; }
  @media (max-width:640px){ .d-grid { grid-template-columns:1fr; } }
  .d-sec h4 { font-size:0.72rem; text-transform:uppercase; letter-spacing:0.16em; color:var(--faint); margin:0 0 0.6rem; }
  .d-sec { margin-bottom:1.3rem; }
  .d-item { display:flex; align-items:center; gap:0.8rem; padding:0.4rem 0; }
  .d-item img { width:46px; height:46px; border-radius:8px; object-fit:cover; flex:none; background:var(--card); }
  .d-item .di-q { color:var(--aka); font-weight:700; }
  .d-item .di-name { flex:1; } .d-item .di-tot { font-weight:600; white-space:nowrap; }
  .d-item.hot { background:rgba(230,126,34,.14); border-radius:8px; padding:0.4rem 0.5rem; margin:0 -0.5rem; }
  .pay-row { display:flex; justify-content:space-between; padding:0.2rem 0; color:var(--dim); }
  .pay-row.total { color:var(--ink); font-weight:700; border-top:1px solid var(--line); margin-top:0.3rem; padding-top:0.5rem; }
  .pay-paid { color:var(--ok); font-weight:700; } .pay-unpaid { color:var(--gold); font-weight:600; }
  .pay-ref { color:var(--faint); font-size:0.8rem; word-break:break-all; margin-top:0.3rem; }
  .info-row { margin:0.15rem 0; } .info-row a { color:var(--ink); }
  .info-row .lbl { color:var(--faint); font-size:0.8rem; }
  .timeline { list-style:none; padding:0; margin:0; }
  .timeline li { display:flex; gap:0.7rem; align-items:baseline; padding:0.2rem 0; }
  .timeline li::before { content:''; width:8px; height:8px; border-radius:50%; background:var(--aka); flex:none; transform:translateY(1px); }
  .timeline .tl-ev { flex:1; } .timeline .tl-t { color:var(--faint); font-size:0.85rem; font-variant-numeric:tabular-nums; }
  .d-actions { display:flex; gap:0.6rem; flex-wrap:wrap; margin-top:0.6rem; }
  .d-actions button { flex:1; min-width:130px; padding:0.85rem; border-radius:11px; border:none; font:inherit; font-weight:700; font-size:1.02rem; }
  .hot-banner { background:rgba(230,126,34,.16); border:1px solid rgba(230,126,34,.6); color:#f0a860; border-radius:10px; padding:0.55rem 0.85rem; margin:0.7rem 0 0.3rem; font-weight:700; font-size:1rem; line-height:1.35; }
  .note { background:rgba(201,162,75,.12); border:1px solid rgba(201,162,75,.4); border-radius:9px; padding:0.5rem 0.8rem; margin-top:0.5rem; font-size:0.95rem; }
  .total { font-weight:700; border-top:1px solid var(--line); padding-top:0.6rem; margin-top:0.4rem; display:flex; justify-content:space-between; }
  .paid { color:var(--ok); font-weight:700; font-size:0.9rem; }
  .unpaid { color:var(--gold); font-weight:600; font-size:0.9rem; }
  .actions { display:flex; gap:0.6rem; margin-top:0.9rem; flex-wrap:wrap; }
  .langs { display:flex; gap:0.3rem; justify-content:center; }
  .langs button { background:none; border:1px solid var(--line); color:var(--dim); border-radius:999px; padding:0.3rem 0.7rem; font:inherit; font-size:0.8rem; font-weight:700; letter-spacing:0.05em; }
  .langs button.active { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .hours-form { display:grid; gap:0.7rem; }
  .hours-form label { display:grid; gap:0.25rem; font-size:0.9rem; color:var(--dim); }
  .hours-form input { font:inherit; padding:0.65rem 0.8rem; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  .hours-form .two { display:grid; grid-template-columns:1fr 1fr; gap:0.7rem; }
  .hours-form button { padding:0.85rem; border-radius:11px; border:none; background:var(--aka); color:#fff; font:inherit; font-weight:700; font-size:1.02rem; }
  .closure { display:flex; justify-content:space-between; align-items:center; gap:0.8rem; }
  .closure .when { font-weight:700; font-size:1.05rem; }
  .closure .msg { color:var(--dim); font-size:0.92rem; }
  .closure .del { background:none; border:1px solid var(--line); color:var(--ink); border-radius:9px; padding:0.45rem 0.7rem; font:inherit; }
  .actions button { flex:1; min-width:120px; padding:0.85rem; border-radius:11px; border:none; font:inherit; font-weight:700; font-size:1.02rem; }
  .b-accept { background:var(--aka); color:#fff; }
  .b-ready { background:var(--gold); color:#241d0c; }
  .b-done { background:var(--ok); color:#fff; }
  .b-cancel { background:none; border:1px solid var(--line) !important; color:var(--dim); flex:0 1 auto; }
  .st { font-size:0.78rem; text-transform:uppercase; letter-spacing:0.12em; font-weight:700; padding:0.25rem 0.7rem; border-radius:99px; border:1px solid var(--line); color:var(--dim); }
  .st.new { color:#fff; background:var(--aka); border-color:var(--aka); }
  .st.accepted { color:var(--gold); border-color:var(--gold); }
  .st.ready { color:var(--ok); border-color:var(--ok); }
  .empty { text-align:center; color:var(--faint); padding:3rem 1rem; }
  /* login */
  #login { max-width:340px; margin:18vh auto; text-align:center; padding:0 1.2rem; }
  #login .seal { width:64px;height:64px;border-radius:10px;background:var(--aka);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.6rem;transform:rotate(-4deg);margin:0 auto 1.2rem; }
  #login input { width:100%; padding:1rem; font-size:1.6rem; text-align:center; letter-spacing:0.5em; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:12px; margin:1rem 0; }
  #login button { width:100%; padding:1rem; border-radius:12px; border:none; background:var(--aka); color:#fff; font:inherit; font-weight:700; font-size:1.05rem; }
  #login .err { color:var(--aka); min-height:1.4em; margin-top:0.6rem; }
  #login .langs button { width:auto; padding:0.3rem 0.8rem; font-size:0.8rem; background:none; color:var(--dim); border:1px solid var(--line); }
  #login .langs button.active { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  /* sound gate */
  #soundgate { position:fixed; inset:0; background:rgba(23,19,16,.92); z-index:50; display:none; place-items:center; text-align:center; padding:1.5rem; }
  #soundgate.show { display:grid; }
  #soundgate button { padding:1.1rem 2.2rem; font-size:1.15rem; border-radius:14px; border:none; background:var(--aka); color:#fff; font-weight:700; }
  #soundgate p { color:var(--dim); margin-top:1rem; max-width:34ch; }
</style>
</head>
<body>

<div id="login" hidden>
  <img class="logo-badge" src="/assets/img/site/logo-192.png" alt="" style="width:40px;height:40px">
  <h1 data-i18n="title">Ichiban Kök</h1>
  <p style="color:var(--dim)" data-i18n="login.hint">Ange PIN-kod för att se beställningar</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" aria-label="PIN-kod">
  <button id="login-btn" data-i18n="login.btn">Logga in</button>
  <div class="langs" style="margin-top:1.2rem"></div>
  <p class="err" id="login-err"></p>
</div>

<div id="app" hidden>
  <header>
    <img class="logo-badge" src="/assets/img/site/logo.png" alt="" style="width:96px;height:96px;margin:0 auto 1.2rem;display:block">
    <h1 data-i18n="title">Ichiban Kök</h1>
    <div class="langs"></div>
    <span id="clock" style="color:var(--dim);font-variant-numeric:tabular-nums"></span>
    <div class="dot" id="conn" title="Anslutning"></div>
  </header>
  <div class="tabs">
    <button id="tab-orders" class="active"><span data-i18n="tab.orders">Beställningar</span><span class="badge" id="badge-orders" hidden></span></button>
    <button id="tab-bookings"><span data-i18n="tab.bookings">Bokningar</span><span class="badge" id="badge-bookings" hidden></span></button>
    <button id="tab-hours"><span data-i18n="tab.hours">Öppettider</span></button>
    <button id="tab-history"><span data-i18n="tab.history">Historik</span></button>
  </div>
  <main id="list"></main>
</div>

<div id="detail" class="modal" hidden>
  <div class="modal-card">
    <button class="modal-close" id="detail-close" aria-label="Close">&times;</button>
    <div id="detail-body"></div>
  </div>
</div>

<div id="soundgate">
  <div>
    <button id="soundgate-btn" data-i18n="sound.btn">🔔 Aktivera larmljud</button>
    <p data-i18n="sound.p">Tryck en gång så att surfplattan/telefonen får spela larm när nya beställningar kommer in. Lägg gärna till sidan på hemskärmen.</p>
  </div>
</div>

<script src="/admin/app.js"></script>
</body>
</html>
