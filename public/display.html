<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ichiban Sushi — beställningar</title>
<link rel="icon" type="image/png" href="/assets/img/site/favicon.png">
<style>
  :root{
    --bg:#010801; --raise:#10140f; --card:#1c211b; --ink:#f3ede3; --dim:#e5c4ac; --faint:#8a8375;
    --aka-ink:#c3302e; --gold:#e2b13c; --ok:#3fa159; --ok-bg:#2f7d43; --line:rgba(229,196,172,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column;padding:2.4vh 2.6vw 1.8vh;gap:2vh}
  header{display:flex;align-items:center;gap:1.1vw;flex:none}
  header img{height:6.2vh;width:auto}
  header .brand{font-family:"Chalkduster","Cabin Sketch",cursive;font-size:3.4vh;letter-spacing:.02em}
  header .brand b{color:var(--aka-ink);font-weight:400}
  header .clock{margin-left:auto;font-size:3vh;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
  header .dot{width:1vh;height:1vh;border-radius:50%;background:#5a544a;margin-left:1vw}
  header .dot.on{background:var(--ok);box-shadow:0 0 1.2vh var(--ok)}
  main{flex:1;display:grid;grid-template-columns:1fr 1.15fr;gap:2.6vw;min-height:0}
  .col{display:flex;flex-direction:column;min-height:0}
  .col h2{flex:none;font-size:3vh;font-weight:800;letter-spacing:.03em;padding-bottom:1.2vh;margin-bottom:1.8vh;border-bottom:.35vh solid var(--line)}
  .col.prep h2{color:var(--dim)}
  .col.ready h2{color:var(--ok)}
  /* preparing: small dark chips */
  .prep .grid{display:flex;flex-wrap:wrap;align-content:flex-start;gap:1.3vh 1.2vw;overflow:hidden}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:1.2vh;padding:1vh 1.6vw;font-size:5.2vh;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.05}
  .chip small{display:block;font-size:1.7vh;color:var(--faint);font-weight:600;margin-top:.3vh}
  .chip.dinein small::before{content:"🍽 "}
  /* ready: one big hero + smaller ones below */
  .ready .wrap{flex:1;display:flex;flex-direction:column;gap:2vh;min-height:0}
  .hero{background:var(--ok-bg);border-radius:2vh;display:flex;align-items:center;justify-content:center;padding:2vh 1vw;min-height:34vh;animation:pop .45s ease}
  .hero b{font-size:22vh;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;line-height:.9}
  .hero .side{position:absolute}
  .ready .rest{display:flex;flex-wrap:wrap;gap:1.3vh 1.2vw;align-content:flex-start}
  .rchip{background:rgba(63,161,89,.16);border:1px solid rgba(63,161,89,.5);border-radius:1.2vh;padding:1vh 1.6vw;font-size:5.2vh;font-weight:800;color:#9fe3ad;font-variant-numeric:tabular-nums;line-height:1.05}
  @keyframes pop{0%{transform:scale(.9);opacity:.3}60%{transform:scale(1.03)}100%{transform:scale(1)}}
  .empty{color:var(--faint);font-size:2.4vh;padding:2vh .5vw}
  footer{flex:none;text-align:center;color:var(--faint);font-size:1.9vh;letter-spacing:.03em}
  .idle{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;z-index:5}
  .idle.show{display:flex}
  .idle img{height:22vh}
  .idle .t{font-family:"Chalkduster","Cabin Sketch",cursive;font-size:6.4vh}
  .idle .t b{color:var(--aka-ink);font-weight:400}
  .idle .s{color:var(--dim);font-size:2.6vh;letter-spacing:.3em;text-transform:uppercase}
</style>
</head>
<body>
  <header>
    <img src="/assets/img/site/logo-192.png" alt="">
    <span class="brand">ICHIBAN <b>SUSHI</b></span>
    <span class="clock" id="clock"></span>
    <span class="dot" id="dot" title="live"></span>
  </header>
  <main>
    <section class="col prep">
      <h2>Tillagas · Preparing</h2>
      <div class="grid" id="prep"></div>
    </section>
    <section class="col ready">
      <h2>Hämta · Ready</h2>
      <div class="wrap" id="ready"></div>
    </section>
  </main>
  <footer>Hämta din beställning med ditt nummer · Collect with your number · 凭订单号取餐</footer>

  <div class="idle" id="idle">
    <img src="/assets/img/site/logo.png" alt="Ichiban Sushi">
    <div class="t">ICHIBAN <b>SUSHI</b></div>
    <div class="s">Välkommen · Welcome · 欢迎光临</div>
  </div>

<script>
(function(){
  var prep=document.getElementById('prep'), ready=document.getElementById('ready'),
      idle=document.getElementById('idle'), dot=document.getElementById('dot');
  function tick(){ try{ document.getElementById('clock').textContent=new Date().toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'}); }catch(e){} }
  setInterval(tick,1000); tick();

  function chip(o){ return '<div class="chip'+(o.dinein?' dinein':'')+'">'+o.n+(o.t?'<small>'+o.t+'</small>':'')+'</div>'; }
  function paint(d){
    var p=d.preparing||[], r=d.ready||[];
    prep.innerHTML = p.length ? p.map(chip).join('') : '<div class="empty">Inga beställningar just nu</div>';
    if(r.length){
      var hero='<div class="hero"><b>'+r[0].n+'</b></div>';
      var rest=r.slice(1).map(function(o){return '<div class="rchip">'+o.n+'</div>';}).join('');
      ready.innerHTML=hero+(rest?'<div class="rest">'+rest+'</div>':'');
    } else {
      ready.innerHTML='<div class="empty">—</div>';
    }
    idle.classList.toggle('show', p.length===0 && r.length===0);
  }
  function load(){ fetch('/api/display',{cache:'no-store'}).then(function(r){return r.json();}).then(paint).catch(function(){}); }

  var es=null, pollTimer=null;
  function startPoll(){ if(!pollTimer){ pollTimer=setInterval(load, 5000); } }
  function connect(){
    try{
      es=new EventSource('/api/display/stream');
      es.onopen=function(){ dot.classList.add('on'); if(pollTimer){clearInterval(pollTimer);pollTimer=null;} };
      es.addEventListener('refresh', load);
      es.onerror=function(){ dot.classList.remove('on'); startPoll(); };
    }catch(e){ startPoll(); }
  }
  load(); connect();
  setInterval(load, 30000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden){ load(); if(!es||es.readyState===2){ connect(); } } });
})();
</script>
</body>
</html>
