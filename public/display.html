<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ichiban Sushi — beställningar</title>
<link rel="icon" type="image/png" href="/assets/img/site/favicon.png">
<style>
  :root{
    --bg:#e9ebe9; --label:#6a6e6b; --divider:#d3d5d2;
    --prep:#3c3e3b; --prep-ink:#ffffff;
    --green:#57b25b; --green-ink:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);overflow:hidden;
    font-family:"Helvetica Neue",Helvetica,Arial,"Instrument Sans",system-ui,sans-serif}
  body{display:flex;flex-direction:column;padding:4vh 4vw}
  main{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
  .col{display:flex;flex-direction:column;min-height:0;padding:0 3vw}
  .col.ready{border-left:2px solid var(--divider)}
  h2{flex:none;font-size:4vh;font-weight:400;color:var(--label);margin-bottom:3vh}
  /* preparing: dark chips, numbers only */
  .grid{display:flex;flex-wrap:wrap;align-content:flex-start;gap:1.6vh 1.6vw;overflow:hidden}
  .chip{background:var(--prep);color:var(--prep-ink);border-radius:.8vh;
    padding:.6vh 1.4vw;font-size:6.5vh;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
  /* ready: big hero + smaller squares */
  .wrap{flex:1;display:flex;flex-direction:column;gap:2.4vh;min-height:0}
  .hero{background:var(--green);border-radius:1vh;display:flex;align-items:center;justify-content:center;
    padding:2vh 1vw;min-height:34vh;animation:pop .4s ease}
  .hero b{font-size:24vh;font-weight:700;color:var(--green-ink);font-variant-numeric:tabular-nums;line-height:.9}
  .rest{display:flex;flex-wrap:wrap;gap:1.6vh 1.6vw;align-content:flex-start}
  .rchip{background:var(--green);color:var(--green-ink);border-radius:.8vh;
    padding:.6vh 1.4vw;font-size:6.5vh;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
  @keyframes pop{0%{transform:scale(.92);opacity:.4}60%{transform:scale(1.03)}100%{transform:scale(1)}}
</style>
</head>
<body>
  <main>
    <section class="col prep">
      <h2>Tillagas</h2>
      <div class="grid" id="prep"></div>
    </section>
    <section class="col ready">
      <h2>Hämta</h2>
      <div class="wrap" id="ready"></div>
    </section>
  </main>

<script>
(function(){
  var prep=document.getElementById('prep'), ready=document.getElementById('ready');
  function pad(n){n=''+n;return n.length>=3?n:('000'+n).slice(-3);}
  function paint(d){
    var p=d.preparing||[], r=d.ready||[];
    prep.innerHTML = p.map(function(o){return '<div class="chip">'+pad(o.n)+'</div>';}).join('');
    if(r.length){
      var hero='<div class="hero"><b>'+pad(r[0].n)+'</b></div>';
      var rest=r.slice(1).map(function(o){return '<div class="rchip">'+pad(o.n)+'</div>';}).join('');
      ready.innerHTML=hero+(rest?'<div class="rest">'+rest+'</div>':'');
    } else { ready.innerHTML=''; }
  }
  function load(){ fetch('/api/display',{cache:'no-store'}).then(function(r){return r.json();}).then(paint).catch(function(){}); }
  var es=null, pollTimer=null;
  function startPoll(){ if(!pollTimer){ pollTimer=setInterval(load, 5000); } }
  function connect(){
    try{
      es=new EventSource('/api/display/stream');
      es.onopen=function(){ if(pollTimer){clearInterval(pollTimer);pollTimer=null;} };
      es.addEventListener('refresh', load);
      es.onerror=function(){ startPoll(); };
    }catch(e){ startPoll(); }
  }
  load(); connect();
  setInterval(load, 30000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden){ load(); if(!es||es.readyState===2){ connect(); } } });
})();
</script>
</body>
</html>
